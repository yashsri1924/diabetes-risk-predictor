<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Disease Risk Predictor</title>
  <style>
    * { box-sizing: border-box; }

    body{
      font-family: Arial, sans-serif;
      max-width:560px;
      margin:40px auto;
      padding:0 20px;
      color:#222;
    }

    h1{font-size:24px;margin-bottom:4px;}
    .subtitle{color:#5C7A7D;font-size:14px;margin-bottom:20px;}

    .disease-tabs{
      display:flex;
      gap:8px;
      margin-bottom:20px;
    }

    .tab-btn{
      flex:1;
      padding:10px;
      border:2px solid #028090;
      background:#fff;
      color:#028090;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
    }

    .tab-btn.active{
      background:#028090;
      color:#fff;
    }

    label{
      display:block;
      margin-top:14px;
      font-size:13px;
      font-weight:bold;
      color:#333;
    }

    .required{color:red;}

    input,select{
      width:100%;
      padding:9px;
      margin-top:4px;
      border:1px solid #ccc;
      border-radius:4px;
      font-size:14px;
    }

    button.predict{
      margin-top:22px;
      width:100%;
      padding:12px;
      background:#028090;
      color:#fff;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
    }

    button.predict:hover{background:#026e7a;}

    #result{
      margin-top:24px;
      padding:18px;
      border-radius:8px;
      display:none;
    }

    .low{background:#E4F3F1;}
    .high{background:#FCE4E1;}

    .factor{font-size:13px;margin:5px 0;}

    .bar-track{
      width:100%;
      height:24px;
      background:#E0E0E0;
      border-radius:12px;
      overflow:hidden;
      margin:12px 0 16px;
    }

    .bar-fill{
      height:100%;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      color:#fff;
      font-size:11px;
      font-weight:bold;
      padding-right:8px;
      transition:0.5s;
    }

    .model-tag{
      display:inline-block;
      margin-top:10px;
      font-size:11px;
      color:#5C7A7D;
    }

    .error-box{
      display:none;
      margin-top:16px;
      padding:12px;
      background:#FCE4E1;
      color:#C0524A;
      border-radius:6px;
      font-size:13px;
    }
  </style>
</head>

<body>

<h1>Disease Risk Predictor</h1>
<div class="subtitle">
  AI-powered risk prediction with explainable results (SHAP)
</div>

<div class="disease-tabs" id="tabs"></div>

<form id="form"></form>

<button class="predict" id="predictBtn" type="button">
  Predict Risk
</button>

<div id="errorBox" class="error-box"></div>
<div id="result"></div>

<script>

const DISEASES = {{ diseases | tojson }};
let currentDisease = Object.keys(DISEASES)[0];

function renderTabs(){

  const tabs=document.getElementById("tabs");
  tabs.innerHTML="";

  Object.entries(DISEASES).forEach(([key,info])=>{

    const btn=document.createElement("button");
    btn.type="button";
    btn.className="tab-btn"+(key===currentDisease?" active":"");
    btn.textContent=info.label;

    btn.onclick=()=>{
      currentDisease=key;
      renderTabs();
      renderForm();

      document.getElementById("result").style.display="none";
      document.getElementById("errorBox").style.display="none";
    };

    tabs.appendChild(btn);

  });

}

function renderForm(){

  const form=document.getElementById("form");
  form.innerHTML="";

  const fields=DISEASES[currentDisease].fields;
  const order=DISEASES[currentDisease].field_order;

  order.forEach(key=>{

    const meta=fields[key];

    const label=document.createElement("label");
    label.innerHTML=`${meta.label} <span class="required">*</span>`;
    form.appendChild(label);

    if(meta.type==="select"){

      const select=document.createElement("select");
      select.id=key;
      select.required=true;

      meta.options.forEach(([val,text])=>{

        const opt=document.createElement("option");
        opt.value=val;
        opt.textContent=text;

        if(val===meta.default)
          opt.selected=true;

        select.appendChild(opt);

      });

      form.appendChild(select);

    }else{

      const input=document.createElement("input");

      // Decimal fields support comma
      if(meta.step){

        input.type="text";
        input.inputMode="decimal";
        input.placeholder="Example: 0,5";

      }else{

        input.type="number";

      }

      input.id=key;
      input.value=meta.default;
      input.required=true;

      form.appendChild(input);

    }

  });

}

async function predict(){

  const form=document.getElementById("form");

  if(!form.checkValidity()){
    form.reportValidity();
    return;
  }

  const payload={};
  const fields=DISEASES[currentDisease].field_order;

  fields.forEach(f=>{

    const value=document.getElementById(f).value.trim();

    // comma to dot conversion
    payload[f]=value.replace(",", ".");

  });

  const errorBox=document.getElementById("errorBox");
  const result=document.getElementById("result");

  errorBox.style.display="none";
  result.style.display="none";

  let res,data;

  try{

    res=await fetch(`/api/predict/${currentDisease}`,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify(payload)

    });

    data=await res.json();

  }catch(e){

    errorBox.textContent="Could not reach the server.";
    errorBox.style.display="block";
    return;

  }

  if(!res.ok){

    errorBox.textContent=data.error||"Something went wrong.";
    errorBox.style.display="block";
    return;

  }

  result.style.display="block";

  const high=data.prediction.toLowerCase().includes("high");
  result.className=high?"high":"low";

  const pct=data.risk_score_percent;

  const color=
    pct<33 ? "#02C39A":
    pct<66 ? "#F4A259":
             "#C0524A";

  let html=`
    <strong>${data.prediction}</strong><br><br>

    Risk Score: <b>${pct}%</b>

    <div class="bar-track">
      <div class="bar-fill"
      style="width:${pct}%;background:${color}">
      ${pct}%
      </div>
    </div>

    <b>Top contributing factors</b><br>
  `;

  data.top_factors.forEach(f=>{

    const dir=f.impact>0?"increased":"decreased";

    html+=`
      <div class="factor">
        • ${f.feature} ${dir} the risk
        (SHAP: ${f.impact})
      </div>
    `;

  });

  html+=`
    <div class="model-tag">
      Model Used: ${data.model_used}
    </div>
  `;

  result.innerHTML=html;

}

document.getElementById("predictBtn")
.addEventListener("click",predict);

renderTabs();
renderForm();

</script>

</body>
</html>
